# Single-page-app fallback + API proxy to the backend service.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Frontend routes (React Router) fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API in Docker Compose (avoids CORS entirely).
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
